<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>این دوره متوقف شده است</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f1ea;
    color: #2b2b2b;
    font-family: Tahoma, "Segoe UI", sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  main {
    max-width: 640px;
    text-align: center;
    background: #fffdf8;
    border: 1px solid #e0d9c8;
    border-radius: 12px;
    padding: 48px 36px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 28px;
  }
  blockquote {
    margin: 0 0 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    font-style: italic;
    line-height: 1.6;
    color: #1f1f1f;
  }
  blockquote[dir="ltr"] {
    direction: ltr;
  }
  .attr {
    font-size: 0.85rem;
    color: #777;
    margin: 0 0 28px;
  }
  .fa {
    font-size: 1.05rem;
    line-height: 2;
    color: #444;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>این دوره فعلاً متوقف شده است.</h1>
  <blockquote dir="ltr">&ldquo;We never know the worth of water till the well is dry.&rdquo;</blockquote>
  <p class="attr">&mdash; Thomas Fuller, <em>Gnomologia</em> (1732)</p>
  <p class="fa">&laquo;ارزش آب را تا وقتی چاه خشک نشود، نمی‌دانیم.&raquo;</p>
</main>
</body>
</html>
